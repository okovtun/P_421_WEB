<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Shadows</title>
	<style>
		/*
	CSS - Cascade Style Sheet
	stylename: value1 value2, value3... valueN;
	stylename: parameter1 parameter2, parameter3... parameterN;

	Selectors:
	descriptor{...}
	#id{...}
	.class{...}
	selector:pseudoelement{...}
	selector::pseudoelement{...}
	------------------------------------
	COMBINATORS:
	box-1 > box-2
	{
		набор стилей применяется только к тем элементам 'box-2', которые непосредственно вложены в box-1;
	}

	whitespace (пробел):
	box-1 box-2
	{
		набор стилей применяется к тем 'box-2', которые вложены в 'box-1' на любом уровне;
	}

	box-1 + box-2
	{
		набор стилей применяется только к тем 'box-2', которые непосредственно следуют за 'box-1';
	}
	box-1 ~ box-2
	{
		набор стилей применяется только к тем 'box-2', которые следуют за 'box-1';
	}
	------------------------------------
	descriptor[attrib=value]
	{

	}
*/
		body
		{
			display: flex;
			/*background-image: radial-gradient(circle,red 20%, green, blue);*/
			background-image: conic-gradient(from -90deg at 10% 10%,red, green, blue);
			background-attachment:fixed;
		}
		.shadow-box-1, .shadow-box-2
		{
			width:256px;
			height:256px;
			border:solid 1px;
			margin: 200px auto;
		}
		.shadow-box-1
		{
			box-shadow:
				-150px	50px	50px	0px		green,
				150px	50px	50px	0px		blue,
				50px	-150px	50px	0px		red;
		}
		.shadow-box-2
		{
			border:solid 3px darkblue;
			border-radius:128px;
			box-shadow:0px 0px 0px 64px white;
			background-image:
				/*radial-gradient(white 50%, blue 55%, white 60%, blue 75%, white 80%),*/
				conic-gradient(white 0deg,white 90deg, darkblue 90deg, darkblue 180deg,white 180deg,white 270deg, darkblue 270deg, darkblue 360deg)
				;
			/*background-image: conic-gradient(red, green,blue, red);*/
			/*background-image:radial-gradient(red, green, blue);*/
		}
		.shadow-box-1 ~ .shadow-box-2
		{
			box-shadow:
				inset	 50px 50px 50px 0px red,
				inset	-50px -50px 50px 0px green;
		}
		.shadow-box-1 .shadow-box-2
		{
			width: 64px;
			height: 64px;
			margin: 50px auto;
			box-shadow:
				inset 5px 5px 15px 5px red,
				inset -5px -0px 15px 5px green;
		}
	</style>
</head>
<body>
    <h1>Shadows</h1>
	<div class="shadow-box-2">	</div>

	<div class="shadow-box-1">
		<div>
			<div class="shadow-box-2"></div>
		</div>
	</div>

	<div class="shadow-box-2">	</div>
</body>
</html>
